name: Mac manual testing (Safari + iOS Simulator)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL a abrir (ej: http://mi-pc:5173 via Tailscale, o un preview deploy)"
        required: true
        default: "http://mi-pc:5173"
      minutes:
        description: "Minutos que la Mac queda encendida"
        required: true
        default: "60"

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Conectar a Tailscale (red privada con tu PC)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-mac

      - name: Habilitar VNC (Screen Sharing)
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # Password del usuario 'runner' (para el login de macOS)
          sudo dscl . -passwd /Users/runner "$VNC_PASSWORD"
          # Activa Remote Management con password VNC "legacy" (max 8 caracteres)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent -console
          echo "Conectate con tu cliente VNC a: gh-mac:5900  (o la IP 100.x de Tailscale)"

      - name: Arrancar simulador de iPhone y abrir la URL en Safari
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          echo "Simulador: $DEVICE"
          xcrun simctl boot "$DEVICE"
          open -a Simulator
          sleep 20
          xcrun simctl openurl booted "${{ inputs.url }}"
          # Safari de macOS tambien, por si quieres probar desktop
          open -a Safari "${{ inputs.url }}"

      - name: Mantener la Mac encendida
        run: sleep $(( ${{ inputs.minutes }} * 60 ))
