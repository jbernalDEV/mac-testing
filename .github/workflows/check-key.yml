name: Check TS_AUTHKEY format

on: workflow_dispatch

permissions: {}

jobs:
  check:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Revisar formato de la key (sin mostrarla)
        env:
          K: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo "Largo: ${#K}"
          [[ "$K" == tskey-auth-* ]] && echo "Prefijo OK" || echo "Prefijo INCORRECTO"
          [[ "$K" == *$'\n'* || "$K" == *$'\r'* ]] && echo "Tiene salto de linea al final: SI" || echo "Tiene salto de linea al final: NO"
